summary: >-
  Every one of the 59 tools the official @apifreaks/mcp server registers resolves to a real APIFreaks REST
  operation. The binding is exact rather than semantic: the MCP server is a thin typed wrapper whose
  src/endpoints.ts maps each tool to a literal path, and every one of those paths appears in the published
  OpenAPI as a concrete operationId, so each tool inherits that operation's parameters as its real input
  contract. The divergence runs the other way: ten capability groups of the REST surface — PDF processing,
  GeoDB reference data, financial validation, email and phone validation, geocoding, web scraping, domain
  suggestions, currency limits and the credits endpoint — have no MCP tool at all. The agent surface is a
  55-of-106 operation subset of the API.
