summary: APIFreaks publishes an official, first-party MCP server under an Apache-2.0 licence. It is a
  LOCAL stdio server distributed on npm as @apifreaks/mcp and launched with `npx -y @apifreaks/mcp` —
  there is no hosted or remote HTTP endpoint, so `tools/list` cannot be introspected over the network.
  The tool set below was read verbatim from the published source (src/tools/*.ts, v1.1.2) and every tool
  is bound to a real OpenAPI operation in mcp/apifreaks-api-hub-for-developers-tool-crosswalk.yml.
server:
  name: io.github.api-freaks/apifreaks-mcp
  title: APIFreaks MCP
  package: '@apifreaks/mcp'
  version: 1.1.2
  license: Apache-2.0
  transport: stdio
  hosted: false
  url: null
  command: npx -y @apifreaks/mcp
  runtime: Node.js >= 24
  repository: https://github.com/api-freaks/apifreaks-mcp
  website: https://apifreaks.com/integrations/mcp-server
  registry_manifest:
    schema: https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json
    file: server.json
    registry_type: npm
    runtime_hint: npx
authentication:
  environment_variables:
  - name: APIFREAKS_API_KEY
    required: true
    secret: true
    description: APIFreaks API key (32 characters), obtained free at apifreaks.com
  note: The server forwards the key to api.apifreaks.com as the `apiKey` query parameter on every call
    (src/client.ts). The key never leaves the operator's machine because the server runs locally.
annotations:
  read_only_hint: true
  destructive_hint: false
  idempotent_hint: true
  open_world_hint: true
  note: Every registered tool carries the READ_ONLY annotation set from src/constants.ts.
