summary: 'APIFreaks publishes an official, first-party, Apache-2.0 MCP server. It is a LOCAL stdio server distributed
  on npm as @apifreaks/mcp and launched with `npx -y @apifreaks/mcp`; there is no hosted or remote HTTP endpoint,
  so tools/list cannot be introspected over the network and the tool set below was read verbatim from the published
  source (src/tools/*.ts + src/endpoints.ts at v2.0.1). v2.0.0 (2026-08-21) was a rewrite, not an increment: the tool
  surface grew from 59 tools in 13 categories to 109 tools in 19 modules — adding geocoding, scraping, email and phone
  validation, VAT/IBAN/SWIFT financial validation, GeoDB geography and the whole PDF pipeline — and it introduced
  MANDATORY module gating. Every tool is bound to a real OpenAPI operation in mcp/apifreaks-api-hub-for-developers-tool-crosswalk.yml.'
server:
  name: io.github.api-freaks/apifreaks-mcp
  title: APIFreaks MCP
  package: '@apifreaks/mcp'
  version: 2.0.1
  published: '2026-08-24'
  license: Apache-2.0
  transport: stdio
  hosted: false
  url: null
  command: npx -y @apifreaks/mcp
  runtime: Node.js >= 24
  repository: https://github.com/api-freaks/apifreaks-mcp
  website: https://apifreaks.com/integrations/mcp-server
  registry_manifest:
    schema: https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json
    file: server.json
    registry_type: npm
    runtime_hint: npx
    declared_version: 2.0.2
    note: server.json on main declares 2.0.2; the latest version actually published to npm at probe time is 2.0.1.
      The manifest is ahead of the registry.
  quick_start: claude mcp add apifreaks -e APIFREAKS_API_KEY=<key> -e ENABLE_MODULES=ip-intelligence,currency,whois,dns,weather
    -- npx -y @apifreaks/mcp
deployment:
  mode: local-stdio
  endpoint: null
  install: npx -y @apifreaks/mcp
  package: https://www.npmjs.com/package/@apifreaks/mcp
  auth: api-key
  verified: searched
  note: 'No remote endpoint exists. server.json declares a single npm package with transport.type "stdio" and no remoteEndpoint,
    and the README documents only local client configs. An agent cannot reach this provider over MCP without a human
    first installing and running the server on a machine. A previous round recorded mode: none with an endpoint of
    https://apifreaks.com/integrations/mcp-server — that URL is the marketing page, never an MCP transport, and the
    server it describes is real and shipping. Corrected here to local-stdio.'
  corrected: '2026-09-04'
module_gating:
  variable: ENABLE_MODULES
  required: true
  modules: 19
  default_behaviour: If ENABLE_MODULES is unset or empty the server registers NO API tools — tools/list returns only
    `list_modules`.
  discovery_tool: list_modules
  syntax: comma-separated module names; hyphens and underscores interchangeable; unknown names ignored and logged
    to stderr
  rationale_published: Advertising all 109 tools in tools/list would fill the client context window, so the operator
    opts in per module.
  consequence: Agent reach here is a configuration outcome. A default install of this server exposes ONE tool. Any
    claim about how many APIFreaks tools an agent can call must name the enabled modules.
authentication:
  environment_variables:
  - name: APIFREAKS_API_KEY
    required: true
    secret: true
    description: APIFreaks API key, obtained free at apifreaks.com
  - name: ENABLE_MODULES
    required: true
    secret: false
    description: Comma-separated modules to expose as tools
  note: The server forwards the key to api.apifreaks.com as the `apiKey` query parameter on every call (src/client.ts).
    The key never leaves the operator machine because the server runs locally.
annotations:
  classes_declared:
  - READ_ONLY
  - WRITE
  - DESTRUCTIVE
  read_only_tools: 92
  write_tools: 16
  destructive_tools: 1
  destructive_list:
  - pdf_file_delete
  note: 'v1.x annotated EVERY tool READ_ONLY. v2 introduced a genuine write surface: the 16 write-annotated PDF tools
    create server-side resources and consume credits, and pdf_file_delete is annotated DESTRUCTIVE. None of them is
    idempotent (idempotentHint false) and the API publishes no replay-protection mechanism — see conventions/.'
