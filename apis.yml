name: APIFreaks - API Hub for Developers
description: >-
  APIFreaks is a first-party REST API hub built by JFreaks Software Solutions (Lahore, Pakistan) that ships
  more than 100 production endpoints behind a single API key and a single shared credit pool. The catalog
  spans IP geolocation and threat intelligence, WHOIS (live, historical, reverse, ASN), DNS (live, history,
  reverse), SSL certificate inspection, domain availability and subdomain discovery, forward and reverse
  geocoding, email and phone validation, VAT/IBAN/SWIFT financial validation, web scraping, website
  screenshots, an asynchronous PDF processing pipeline, currency and commodity market data, ZIP code and
  GeoDB reference data, weather (current, forecast, historical, marine, air quality, flood), timezones,
  user-agent parsing and astronomy. Credits are charged only on successful 2xx responses and refunded on
  errors, new accounts get 10,000 free credits with no card, and the whole surface is published as 102
  OpenAPI 3.1 specifications plus an official Apache-2.0 MCP server exposing 59 agent tools.
