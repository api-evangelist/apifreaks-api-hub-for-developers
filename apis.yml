name: APIFreaks - API Hub for Developers
description: >-
  APIFreaks is a first-party REST API hub built by JFreaks Software Solutions (Lahore, Pakistan) that ships
  more than 100 production endpoints behind a single API key and a single shared credit pool. The catalog
  spans IP geolocation and threat intelligence, WHOIS (live, historical, reverse, ASN), DNS (live, history,
  reverse), SSL certificate inspection, domain availability and subdomain discovery, forward and reverse
  geocoding, email and phone validation, VAT/IBAN/SWIFT financial validation, web scraping, website
  screenshots, an asynchronous PDF processing pipeline, currency and commodity market data, ZIP code and
  GeoDB reference data, weather (current, forecast, historical, marine, air quality, flood), timezones,
  user-agent parsing and astronomy. Credits are charged only on successful 2xx responses and refunded on
  errors, new accounts get 10,000 free credits with no card, and the whole surface is published as 102
  OpenAPI 3.1 specifications plus an official Apache-2.0 MCP server exposing 59 agent tools.
image: https://apifreaks.com/img/opengraph-image.jpg
url: https://raw.githubusercontent.com/api-evangelist/apifreaks-api-hub-for-developers/refs/heads/main/apis.yml
created: '2026-07-29'
modified: '2026-08-09'
specificationVersion: '0.23'
tags:
  - IP intelligence
  - geolocation
  - WHOIS
  - domain intelligence
  - DNS
  - geocoding
  - email validation
  - phone validation
  - SSL
  - web scraping
  - screenshots
  - PDF processing
  - currency
  - forex
  - commodities
  - financial validation
  - ZIP codes
  - weather
  - timezone
  - GeoDB
  - user-agent parsing
  - astronomy
  - developer tools
  - MCP
  - agent-ready
  - OCR
apis:
- name: APIFreaks MCP Server
  description: >-
    Official first-party Model Context Protocol server (Apache-2.0) exposing 59 read-only tools across
    13 categories — IP intelligence, WHOIS, DNS, SSL, domain, weather, currency, commodity, ZIP code,
    screenshot, timezone, user-agent and astronomy. Distributed on npm as @apifreaks/mcp and run locally
    over stdio with `npx -y @apifreaks/mcp`; there is no hosted remote endpoint. Authenticates with the
    same single APIFREAKS_API_KEY as the REST API.
  humanURL: https://apifreaks.com/integrations/mcp-server
  baseURL: https://api.apifreaks.com/v1.0/
  tags:
  - MCP
  - agent-ready
  - developer tools
  - IP intelligence
  - WHOIS
  - DNS
  - weather
  - currency
