model:
  style: single-key
  key_scope: >-
    One API key covers every APIFreaks product. There are no per-product keys, no OAuth, no OIDC, no
    scopes and no per-key permission model documented; access is governed by the account's credit balance,
    plan and organization role rather than by token scope.
  key_length: 32 characters
  obtain: https://apifreaks.com/signup (dashboard issues the key; 10,000 free credits, no card)
  rotation: >-
    Self-service reset from the dashboard — the docs state "If your API key has been compromised, you can
    reset it by clicking the reset button on the dashboard."
  transport:
    - mechanism: header
      name: X-apiKey
      preferred: true
    - mechanism: query
      name: apiKey
      preferred: false
      caution: >-
        Keys placed in the query string are routinely written to proxy, CDN and server access logs. The
        official @apifreaks/mcp server uses this form (src/client.ts appends apiKey to every request).
  organization_roles: >-
    Org admins can restrict which endpoints a member may call — the docs list 403 responses for
    "You need to be organization admin to access this endpoint" and "Organization admin restricted you to
    use this API endpoint". This is an account-level authorization layer, not an OAuth scope layer.
auth_failure_codes:
  - {status: 401, meaning: Provided API key is invalid}
  - {status: 401, meaning: The request IP is blocked from accessing this API}
  - {status: 403, meaning: Account not active / blocked for unusual activity / role lacks permission}
  - {status: 402, meaning: Credit subscription deactivated or credit limit exceeded}
gaps:
