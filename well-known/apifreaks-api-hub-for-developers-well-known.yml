gaps:
- No RFC 9116 /.well-known/security.txt on apifreaks.com. The provider publishes a support contact (support@apifreaks.com)
  and a contact page, so a security.txt is a low-cost addition and is the single cheapest discovery document missing
  here.
- No RFC 9727 /.well-known/api-catalog, despite APIFreaks publishing 104 OpenAPI 3.1.1 specs on npm as @apifreaks/openapi-specs
  and at github.com/api-freaks/af-openapi-specs. An api-catalog pointing at those specs would make the entire catalog
  machine-discoverable from the apex domain — the provider already does the hard part and skips the cheap one.
- No /.well-known/agent-card.json or /.well-known/agent.json on any host, so there is no A2A surface. Nothing is written
  to a2a/ — an agent card must be served by the provider and can never be authored here.
