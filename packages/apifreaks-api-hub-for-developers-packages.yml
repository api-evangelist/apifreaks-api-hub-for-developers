summary: 'APIFreaks publishes first-party client SDKs from the github.com/api-freaks organization in ten languages.
  Eight resolve on a public registry; the Java and .NET SDKs exist as GitHub repositories but return zero hits on
  Maven Central and NuGet (re-probed 2026-09-04, still absent), and Swift ships as a SwiftPM git dependency. CURRENCY
  IS THE FINDING: every language SDK was last released on 2026-07-09. Since then the provider has shipped an MCP v2
  rewrite (2026-08-21) and republished all 104 OpenAPI specs (2026-09-03) adding two PDF Template APIs and a machine-readable
  X-AF-Credits-Cost response header. The SDKs are ~2 months behind the API they wrap; the MCP server and the spec
  package are the only currently-maintained distributions.'
