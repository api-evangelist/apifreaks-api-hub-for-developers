  retention: The published example shows expiresAt exactly 7 days after createdAt, i.e. generated output resources
    are retained for one week.
gaps:
- No AsyncAPI document is published for the webhook surface, so the event payload has no machine-readable schema of
  its own. The closest thing is the TaskStatusResponse schema on the polling endpoint; whether the webhook body is
  identical is not documented.
- No webhook signature scheme. A receiver cannot verify that a completion callback came from APIFreaks other than
  by checking a static header it supplied itself.
- No published retry schedule or maximum attempt count, only "all the retries" in the parameter description.
not_event_bearing:
- generatePdfFromTemplate
- generatePdfsFromCsv
