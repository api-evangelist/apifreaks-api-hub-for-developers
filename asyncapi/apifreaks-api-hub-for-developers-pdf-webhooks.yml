docs: https://apifreaks.com/api/merge-pdf
summary: 'APIFreaks has exactly one event surface, and it is outbound webhooks on the asynchronous PDF pipeline. Every
  long-running PDF operation returns a taskId immediately and will POST a completion notification to a caller-supplied
  webhook_url. There is no streaming API, no event bus, no subscription management endpoint, and no published AsyncAPI
  document — the whole contract lives as three query/header parameters repeated across 16 operations in the OpenAPI.
  Re-measured against the 2026-09-03 republish: still 16, and the two NEW PDF Template operations shipped 2026-08-11
  (generatePdfFromTemplate, generatePdfsFromCsv) are deliberately outside it — they render synchronously and return
  a hosted URL, so there is nothing to notify. The rest of the platform (IP, WHOIS, DNS, currency, weather, GeoDB,
  validation) is synchronous request/response only and has no event surface at all.'
model:
  style: caller-supplied-url
  direction: outbound
  subscription: per-request
  registration_endpoint: null
  notes: There is no webhook-registration API and no dashboard endpoint catalog. The destination URL is passed on
    the request that starts the task, so each task carries its own callback.
parameters:
- name: webhook_url
  in: query
  type: string
  required: false
  description: The URL to which the webhook notification will be sent after the task is completed.
- name: webhook_failure_notification
  in: query
  type: boolean
  required: false
  description: If true, an email notification is also sent when the webhook request fails all retries. The email goes
    to the requesting user, or to their organization's admin if they belong to one.
- name: X-Webhook-Authorization
  in: header
  type: string
  required: false
  description: Optional custom header forwarded on the webhook call. Format `Key:Value` (e.g. `Authorization:Bearer
    <token>`).
delivery:
  retries: true
  retry_policy_published: false
  failure_fallback: email notification (opt-in via webhook_failure_notification)
  signature_scheme: null
  signature_note: No HMAC signature, no timestamp, no replay-protection header is documented. Receiver-side authentication
    is delegated entirely to whatever static value the caller puts in X-Webhook-Authorization, which is a shared secret
    echoed on every call rather than a per-payload signature.
