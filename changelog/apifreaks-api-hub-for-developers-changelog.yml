- date: '2026-08-12'
  title: 'Credit Update: Commodity Time Series API'
  type: pricing-change
  breaking: false
  highlights:
  - Credit cost for the Commodity Time Series API raised from 40 credits to 50 credits per request.
- date: '2026-08-11'
  title: Postman Collections - Now on Every Reference Page
  type: feature
  breaking: false
  highlights:
  - Every API now has a Postman collection published to the official APIFreaks workspace.
  - A Postman button on each reference page opens the collection.
  see: https://www.postman.com/apifreaks-official/apifreaks/overview
- date: '2026-08-11'
  title: PDF Generator API - Now Available
  type: new-apis
  breaking: false
  highlights:
  - 'Two new operations: generatePdfFromTemplate (JSON payload -> hosted PDF URL) and generatePdfsFromCsv (one PDF
    per CSV row).'
  - Dynamic tables that paginate automatically, native barcodes and QR codes.
  - data_url input for data that lives at an endpoint, and version pinning (v1, v2 ...) so production output stays
    stable while templates are iterated.
  - Templates are authored in the browser Template Builder and called by template_id; there is no template CRUD API.
  see: openapi/apifreaks-api-hub-for-developers-pdf-template-apis-api-openapi.yml
- date: '2026-07-31'
  title: 'New Credit Update: Zip Codes Radius Search API'
  type: pricing-change
  breaking: false
  highlights:
  - Credit cost for the ZIP Codes Radius Search API raised from 3 credits to 5 credits per request.
- date: '2026-07-21'
  title: 'Template Builder: Design and Generate PDFs Right in Your Browser'
  type: feature
  breaking: false
  highlights:
  - Visual drag-and-drop PDF template designer with 6 element types (Text, Image, Shape, QR Code, Barcode, Table).
  - 20+ barcode formats, 31 font families, header/body/footer section layout.
  - 10 pre-built templates (invoice, certificate, resume, purchase order, meeting minutes).
  - Version history per template; generate PDFs from any app with a single API call and a JSON payload.
- date: '2026-07-09'
  title: 'API Release: V2.0 Endpoints Now Live'
  type: version-release
  breaking: false
  deprecation_notice: true
  highlights:
  - Six endpoints migrated to /v2.0 paths with optimized upstream routing.
  - All existing V1.0 endpoints continue to function normally.
  - V1.0 announced for future retirement with no date given.
  see: lifecycle/apifreaks-api-hub-for-developers-lifecycle.yml
- date: '2026-06-26'
  title: APIFreaks MCP Server is Now Live
  type: feature
  breaking: false
  highlights:
  - Official MCP server connecting Claude, Cursor, VS Code, Windsurf, Gemini CLI and Codex CLI to the API catalog.
  - Installed with `npx -y @apifreaks/mcp`; runs locally so the API key stays in the operator's config.
  - One key covers every API exposed through the server.
  see: mcp/apifreaks-api-hub-for-developers-mcp.yml
- date: '2026-06-18'
  title: GeoDB APIs — Now Available
  type: new-apis
  breaking: false
  highlights:
  - Five new APIs under a new GeoDB category — Administrative Units, Countries, Regions, Cities, Flags.
  - Flags served as PNG, WEBP and SVG in flat or round styles at multiple sizes.
