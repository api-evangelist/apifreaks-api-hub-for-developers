deprecation:
  policy_url: https://apifreaks.com/announcements
  policy_published: false
  sunset_header: false
  deprecation_header: false
  announced: true
  statement: '"V1 Remains Active: All existing V1.0 endpoints continue to function normally to support active users.
    Future Deprecation: V1.0 will eventually be retired. Plan your migration early to avoid disruption."'
  notice_period: unspecified
  gap: 'A retirement is announced with no date, no notice window, and no machine-readable signal. Neither RFC 8594
    Sunset nor the Deprecation header is emitted, and no operation in the 104 published specs carries `deprecated:
    true` — including the six v1.0 paths superseded on 2026-07-09. Re-checked against the 2026-09-03 republish: still
    absent, so the provider has now shipped a full contract refresh without taking the free opportunity to mark them.
    An agent calling a v1.0 endpoint has no way to learn it is on the retirement path.'
