summary: APIFreaks versions in the URI path. A V2.0 generation went live on 9 July 2026 for six endpoints, with V1.0
  explicitly kept active and an announced but UNDATED future retirement. There is no published deprecation policy
  document, no Sunset/Deprecation header support advertised, and no SLA page; the operational commitment visible in
  public is a third-party updown.io status page.
