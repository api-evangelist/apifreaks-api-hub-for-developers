source: openapi/ (27 refined docs) + openapi/_original/ (104 publisher specs, republished 2026-09-03) + https://apifreaks.com/docs
  + https://apifreaks.com/llms.txt + live /.well-known probes (2026-09-04)
summary: 'APIFreaks conforms strongly to the machine-readable-contract standards (OpenAPI 3.1, MCP with real tool
  annotations, a current llms.txt and 68 markdown reference twins) and weakly to the operational and security-discovery
  standards (no security.txt, no api-catalog, no OAuth/OIDC, no RFC 9457, no Sunset header, no idempotency). There
  is no published compliance program — no SOC 2, ISO 27001, PCI DSS, HIPAA or FedRAMP claim appears anywhere on the
  site, and no trust centre exists — so no Compliance pointer is emitted. The pattern is consistent: this provider
  invests in what an agent READS and not in what an operator AUDITS.'
standards:
- id: openapi-3.1
  conforms: true
  evidence: 104 specs published at github.com/api-freaks/af-openapi-specs and on npm as @apifreaks/openapi-specs v0.3.2
    (2026-09-03), all declaring openapi 3.1.1, with operationIds, tags, summaries, descriptions, request/response
    examples, components.schemas reuse and — new in this release — a declared components.headers.X-AF-Credits-Cost
    wired onto 200/400 responses across the catalog.
- id: mcp
  conforms: true
  evidence: Official Apache-2.0 MCP server @apifreaks/mcp v2.0.1 (2026-08-24) with a server.json manifest against
    the 2025-12-11 MCP server schema; 109 tools across 19 opt-in modules plus list_modules, stdio transport, and READ_ONLY
    / WRITE / DESTRUCTIVE tool annotations.
- id: mcp-remote-http
  conforms: false
  evidence: stdio only — no hosted or remote HTTP/SSE MCP endpoint is published.
- id: llms-txt
  conforms: true
  evidence: https://apifreaks.com/llms.txt returns 200 text/plain and is CURRENT — it reports the v2 MCP surface (109
    tools, 19 modules) within days of that release. All 68 links it carries were probed 2026-09-04 and every one returned
    200; nothing in it is stale or dead.
- id: apikey-auth
  conforms: true
  evidence: components.securitySchemes declares ApiKeyAuthHeader (X-apiKey) and ApiKeyAuthQuery (apiKey) in every
    spec.
- id: oauth2
  conforms: false
  evidence: No OAuth 2.0 anywhere; no /.well-known/oauth-authorization-server (404 on apifreaks.com and api.apifreaks.com).
- id: oidc
