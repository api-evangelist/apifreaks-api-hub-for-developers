- id: idempotency-key
  conforms: false
  evidence: 'No Idempotency-Key header is documented and none appears as a parameter in any of the 104 specs, including
    the write-bearing PDF pipeline. The provider now publishes machine-readable confirmation: the MCP server annotates
    its 16 PDF write tools idempotentHint: false.'
- id: agent-readable-docs-markdown
  conforms: true
  evidence: 68 API reference pages are served as first-party markdown twins at https://apifreaks.com/api/<product>/reference.md
    with content-type text/markdown, each carrying YAML frontmatter (title, version, description). Every one was probed
    2026-09-04 and returned 200. They are advertised from llms.txt, so an agent can discover and read the full reference
    without executing JavaScript — the same docs a human gets from the Next.js pages. This is a deliberate agent surface,
    not a side effect.
- id: domain-standard
  conforms: false
  evidence: 'Checked for a declared domain standard in the contract itself. None applies: APIFreaks is a horizontal
    developer-utility hub (IP, DNS, WHOIS, weather, currency, PDF), not a participant in a standardized vertical.
    No SCIM URN, OData $metadata, OpenRTB, Sparkplug, ActivityPub, LTI/OneRoster/Ed-Fi, OAI-PMH, ORCID/DataCite, HL7v2/X12/EDIFACT
    or ISO 20022 shape appears in any of the 104 specs. The nearest adjacent standards are the ones its data DESCRIBES
    rather than ones its API speaks — IANA DNS RR type codes (returned as values by dns_lookup), ISO 4217 currency
    codes, ISO 3166 country codes, IBAN (ISO 13616) and SWIFT/BIC (ISO 9362) as validated inputs to the financial
    family. Consuming a code list is not conforming to a message standard, so this is recorded false rather than credited.
    Reward-only check: no penalty applies to a market with no standard.'
  adjacent_code_systems:
  - IANA DNS RR type codes
  - ISO 4217
  - ISO 3166-1 alpha-2
  - ISO 13616 (IBAN)
  - ISO 9362 (SWIFT/BIC)
  - EU VIES / UK HMRC VAT number validation
- id: mcp-tool-annotations
  conforms: true
  evidence: 'src/constants.ts declares READ_ONLY, WRITE and DESTRUCTIVE annotation sets and applies them per tool:
    92 read-only, 16 write, 1 destructive (pdf_file_delete). Most published MCP servers annotate nothing; this one
    tells an agent which of its tools mutate state before it calls them.'
