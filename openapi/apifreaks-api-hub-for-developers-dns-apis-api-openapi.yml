                    - status: true
                      queryTime: '2026-06-17 09:43:40'
                      domainName: example.com
                      domainRegistered: true
                      dnsTypes:
                        A: 1
                        NS: 2
                        SOA: 6
                        MX: 15
                        TXT: 16
                        AAAA: 28
                        SPF: 99
                      dnsRecords:
                      - name: example.com
                        type: 1
