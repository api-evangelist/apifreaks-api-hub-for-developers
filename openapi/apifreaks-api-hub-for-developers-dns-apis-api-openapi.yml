                      dnsTypes:
                        A: 1
                      dnsRecords:
                      - name: qa-allure.salt-dev.ws
                        type: 1
                        dnsType: A
                        ttl: 300
                        rawText: "qa-allure.salt-dev.ws.\t300\tIN\tA\t8.8.8.8"
                        rRsetType: 1
                        address: 8.8.8.8
                    - queryTime: '2026-03-21'
                      domainName: www.hailibu.cn
                      dnsTypes:
                        A: 1
                      dnsRecords:
                      - name: www.hailibu.cn
                        type: 1
                        dnsType: A
