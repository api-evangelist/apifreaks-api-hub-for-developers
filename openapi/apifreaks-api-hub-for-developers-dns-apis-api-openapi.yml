                  value:
                    timestamp: '2026-07-23T09:51:08.447Z'
                    status: 400
                    error: Invalid Param Exception
                    message: 'Please provide correct dns records type(s) [For Technical Support: support@whoisfreaks.com]'
                    path: /v2.0/dns/live
                malformedHostname:
