                      dnsTypes:
                        A: 1
                      dnsRecords:
                      - name: www.maguire.romamenu.cotest.avalon-invest.pro
                        type: 1
                        dnsType: A
                        ttl: 300
                        rawText: "www.maguire.romamenu.cotest.avalon-invest.pro.\t300\tIN\tA\t8.8.8.8"
                        rRsetType: 1
                        address: 8.8.8.8
