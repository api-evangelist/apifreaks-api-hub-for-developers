                      symbol: $
                    asn:
                      as_number: AS15169
                      organization: Google LLC
                      country: US
                      type: BUSINESS
                      domain: google.com
                      date_allocated: '2000-03-30'
                      rir: ARIN
                    company:
                      name: Google LLC
                      type: HOSTING
                      domain: google.com
                    time_zone:
