                      state_prov: California
                      state_code: US-CA
                      district: Santa Clara
                      city: Mountain View
                      zipcode: 94043-1351
                      latitude: '37.42240'
                      longitude: '-122.08421'
                      is_eu: false
                      country_flag: https://ipgeolocation.io/static/flags/us_64.png
                      geoname_id: '6301403'
                      country_emoji: 🇺🇸
                    country_metadata:
                      calling_code: '+1'
                      tld: .us
                      languages:
                      - en-US
