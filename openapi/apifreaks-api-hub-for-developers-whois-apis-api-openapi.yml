components:
  schemas:
    Contacts:
      type: object
      description: Direct contact addresses collected from the ASN's WHOIS record.
      required:
      - emailContacts
      - abuseContacts
      properties:
        emailContacts:
          type: array
          description: General contact email addresses for the ASN.
          items:
            type: string
        abuseContacts:
          type: array
          description: Abuse-reporting contact email addresses for the ASN.
          items:
            type: string
    RegistryData:
      type: object
      description: Normalized registry-level WHOIS data. Contains the same structure as the top-level response but reflects data from the registry's own WHOIS server rather than the registrar's.
      required: []
      properties:
        domain_name:
          type:
          - string
          - 'null'
          description: Domain name as recorded by the registry.
        query_time:
          type:
          - string
          - 'null'
          description: Timestamp of the registry WHOIS query (YYYY-MM-DD HH:mm:ss).
        whois_server:
          type:
          - string
          - 'null'
          description: Registry WHOIS server that provided this data.
        domain_registered:
          type:
          - string
          - 'null'
          enum:
          - 'yes'
          - 'no'
          - restricted
          description: Registration status from the registry.
        create_date:
          type:
          - string
          - 'null'
          format: date
          description: Domain creation date as recorded by the registry (YYYY-MM-DD).
        update_date:
          type:
          - string
          - 'null'
          format: date
          description: Last update date as recorded by the registry (YYYY-MM-DD).
        expiry_date:
          type:
          - string
          - 'null'
          format: date
          description: Domain expiry date as recorded by the registry (YYYY-MM-DD).
        domain_registrar:
          $ref: '#/components/schemas/DomainRegistrar_3'
        name_servers:
          type:
          - array
          - 'null'
          description: List of name servers as recorded by the registry.
          items:
            type: string
        domain_status:
          type:
          - array
          - 'null'
          description: List of domain status codes from the registry.
          items:
            type: string
        whois_raw_registery:
          type:
          - string
          - 'null'
          description: Raw WHOIS output from the registry server.
    DomainRegistrar_2:
      type: object
      description: Registrar of record at the time of the snapshot.
      properties:
        iana_id:
          type: string
          description: IANA registrar ID.
        registrar_name:
          type: string
          description: Registered name of the registrar.
        whois_server:
          type: string
          description: WHOIS server operated by the registrar.
        website_url:
          type: string
          description: Registrar's website URL.
        email_address:
          type: string
          description: Registrar abuse or contact email address.
        phone_number:
          type: string
          description: Registrar contact phone number.
    AutNum:
      type: object
      description: Parsed autnum (Autonomous System Number) registry object and its routing policy attributes.
      required:
      - aut_num
      - as_handle
      - as_name
      - tech_contacts
      - abuse_contacts
      - date_updated
      - source
      properties:
        aut_num:
          type: string
          description: ASN identifier as recorded on the autnum object.
        as_handle:
          type: string
          description: Registry handle for the autnum object (e.g. AS15).
        as_name:
          type: string
          description: Registered name for the autnum object.
        description:
          type: array
          description: Free-text description lines attached to the autnum object.
          items:
            type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code recorded on the autnum object.
        status:
          type: string
          description: Autnum object status as recorded by the registry.
        member_of:
          type: array
          description: Route-set or as-set objects this ASN is a member of.
          items:
            type: string
        import_via:
          type: array
          description: BGP import-via routing policy statements.
          items:
            type: string
        import:
          type: array
          description: BGP import routing policy statements.
          items:
            type: string
        mp_import:
          type: array
          description: Multiprotocol BGP import routing policy statements (mp-import).
          items:
            type: string
        export_via:
          type: array
          description: BGP export-via routing policy statements.
          items:
            type: string
        export:
          type: array
          description: BGP export routing policy statements.
          items:
            type: string
        mp_export:
          type: array
          description: Multiprotocol BGP export routing policy statements (mp-export).
          items:
            type: string
        default:
          type: array
          description: BGP default routing policy statements.
          items:
            type: string
        mp_default:
          type: array
          description: Multiprotocol BGP default routing policy statements (mp-default).
          items:
            type: string
        organization:
          type: string
          description: Registry handle of the organization that holds the autnum object.
        sponsoring_organization:
          type: string
          description: Registry handle of the sponsoring organization, when applicable.
        admin_contacts:
          type: array
          description: Registry handles of administrative contacts for the autnum object.
          items:
            type: string
        tech_contacts:
          type: array
          description: Registry handles of technical contacts for the autnum object.
          items:
            type: string
        abuse_contacts:
          type: array
          description: Registry handles of abuse contacts for the autnum object.
          items:
            type: string
        date_created:
          type: string
          format: date
          description: Date the autnum object was first registered.
        date_updated:
          type: string
          format: date
          description: Date the autnum object was last updated.
        source:
          type: string
          description: URL of the registry record this autnum object was parsed from.
    ParsedWhoisResponse:
      type: object
      description: Structured breakdown of the raw WHOIS response into individual records and contacts.
      required:
      - status
      - whois_server
      - aut_nums
      - organization
      - technical_contacts
      - abuse_contacts
      properties:
        status:
          type: boolean
          description: true if the WHOIS response was parsed successfully.
        whois_server:
          type: string
          description: WHOIS server that returned the raw response (e.g. whois.arin.net).
        aut_nums:
          type: array
          description: Parsed autnum object(s) for the requested ASN.
          items:
            $ref: '#/components/schemas/AutNum'
        organization:
          $ref: '#/components/schemas/Organization'
        technical_contacts:
          type: array
          description: Parsed technical contact records for the ASN.
          items:
            $ref: '#/components/schemas/WhoisContact'
        abuse_contacts:
          type: array
          description: Parsed abuse contact records for the ASN.
          items:
            $ref: '#/components/schemas/WhoisContact'
        whois_raw_response:
          type: string
          description: Unparsed raw WHOIS text, when returned separately from whoisResponse.
        r_whois_raw_response:
          type: string
          description: Raw referral WHOIS (rwhois) text, when the registry delegates to a referral server.
        query_time:
          type: string
          format: date-time
          description: Timestamp when the WHOIS query was executed.
    AsnRelation:
      type: object
      description: A related Autonomous System (upstream provider, downstream customer, or BGP peer).
