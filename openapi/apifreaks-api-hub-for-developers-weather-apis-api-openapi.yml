        sun_status:
          type: string
          description: Current position of the Sun relative to the horizon (above_horizon, below_horizon, or -).
        moon_phase:
          type: string
          description: Current lunar phase (NEW_MOON, WAXING_CRESCENT, FULL_MOON, WANING_GIBBOUS, etc.).
