        region_code:
          type: string
          description: Region code or abbreviation.
        city:
          type: string
          description: City associated with the postal code.
        district:
          type: string
          description: District or neighborhood associated with the postal code. Can be an empty string when no district-level data exists.
        distance:
          type: number
          format: float
          description: Distance from the center point to this postal code, in the unit specified by the unit parameter.
    ZipcodeDistanceItem:
      type: object
      description: Distance from the base point to one matched comparison code.
      required:
      - code
      - distance
      properties:
        code:
          type: string
          description: The matched comparison ZIP/postal code.
        distance:
          type: number
          format: float
          description: Distance from the base point to this code, in the unit specified by the unit field (default km).
    ZipcodeDistanceMatchItem:
      type: object
      description: A single matched pair of ZIP/postal codes with the distance between them.
      required:
      - code_1
      - code_2
      - distance
      properties:
        code_1:
          type: string
          description: First ZIP/postal code in the pair.
        code_2:
          type: string
          description: Second ZIP/postal code in the pair.
        distance:
          type: number
          format: float
          description: Distance between the ZIP/postal code pair, in the unit specified by the unit field (default km).
    PostalCode:
      type: string
      description: A single ZIP or postal code.
    ZipcodeSearchCityResponse:
      type: object
      description: ZIP/postal codes for the requested city, with pagination metadata.
      required:
      - total_results
      - total_pages
