openapi: 3.2.0
info:
  title: Apifreaks Api Hub For Developers SSL APIs API
  version: 1.0.0
  contact:
    name: APIFreaks Support
    url: https://apifreaks.com/contact
    email: support@apifreaks.com
  description: 'Operations tagged SSL APIs across 2 of this provider''s published API definitions: apifreaks-api-hub-for-developers-ssl-certificate-chain-lookup-openapi.json, apifreaks-api-hub-for-developers-ssl-certificate-lookup-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.apifreaks.com/v1.0
  description: SSL Certificate Chain Lookup API Server
security:
- ApiKeyAuthHeader: []
