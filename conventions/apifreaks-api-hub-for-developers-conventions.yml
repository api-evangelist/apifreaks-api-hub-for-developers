generated: '2026-09-04'
method: searched
source: https://apifreaks.com/docs + https://apifreaks.com/llms.txt + openapi/ (27 refined docs, 108 operations) +
  @apifreaks/mcp v2.0.1 tool annotations
summary: 'Cross-cutting request/response semantics for the APIFreaks platform, captured from the published platform
  docs and confirmed against the 102 published OpenAPI 3.1 specs. The platform is deliberately uniform: one key, one
  credit pool, one error envelope, one content-negotiation mechanism across every product. It is also almost entirely
  read-only lookup traffic — which is why there is no idempotency contract and no pagination contract to capture.'
authentication:
  styles:
  - api_key_header
  - api_key_query
  api_key_header: X-apiKey
  api_key_query: apiKey
  oauth2: false
  scopes: false
  see: authentication/apifreaks-api-hub-for-developers-authentication.yml
protocols:
  required:
  - HTTP/1.1
  - HTTP/2
  note: The docs state all APIs require HTTP/1.x or HTTP/2.
methods:
  supported:
  - GET
  - POST
  - DELETE
  post_content_types:
  - application/json
  note: Single-item lookups are GET; bulk/batch variants are POST with a JSON body. PDF operations are POST (multipart/form-data
    for uploads). One DELETE exists (/v1.0/pdf/file).
content_negotiation:
  formats:
  - json
  - xml
  default: json
  query_parameter: format
  header: Accept
  note: Every operation exposes a `format` query parameter with enum [json, xml] and default json.
idempotency:
  coverage: none
  documented: false
  idempotency_key_header: null
  scope: []
  write_operations: 22
  notes: 'No Idempotency-Key mechanism is documented and none appears as a parameter or header in any of the 104 published
    specs. Most of the surface is safe to retry because it is read-only lookup, but the write-bearing PDF pipeline
    has NO replay-protection contract: a retried POST /v1.0/pdf/merge creates a second task and consumes credits again.
    The provider now says so in its own machine-readable metadata — the official MCP server v2.0.1 annotates its 16
    PDF write tools idempotentHint: false, against readOnlyHint/idempotentHint true on the other 92. coverage is `none`,
    not `partial`: partial would require a replay mechanism scoped to named operations, and there is no mechanism
    at all.'
  evidence:
  - source: openapi/_original/ (104 specs)
    finding: zero occurrences of Idempotency-Key or any request-supplied dedupe token
  - source: https://github.com/api-freaks/apifreaks-mcp src/constants.ts
    finding: 'WRITE = { idempotentHint: false }, applied to 16 PDF tools'
pagination:
  style: none
  notes: No cursor or offset pagination is documented or present in the specs. Bulk operations are bounded by hard
    batch caps instead of pages.
batch_limits:
- api: Bulk WHOIS Lookup
  max: 100
  unit: domains
- api: Bulk DNS Lookup
  max: 100
  unit: hostnames
- api: Bulk Domain Checker
  max: 100
  unit: domains
- api: Bulk Email Validation
  max: 100
  unit: emails
- api: Bulk Phone Validation
  max: 100
  unit: numbers
- api: Bulk User Agent Parser
  max: 100
  unit: strings
- api: Bulk Screenshot
  max: 50
  unit: urls
- api: Merge PDF
  max: 100
  unit: files
- api: IP Threat Intelligence (bulk)
  max: 50000
  unit: ips
batch_limit_exceeded: HTTP 413 Payload Too Large
field_selection:
  supported: true
  parameters:
  - name: fields
    semantics: comma-separated dot-path allowlist, e.g. location.city,asn.organization
  - name: excludes
    semantics: comma-separated dot-path denylist
  - name: include
    semantics: opt-in response modules on IP geolocation (security, hostname, liveHostname, hostnameFallbackLive,
      user_agent, abuse, dma_code, geo_accuracy, or *)
  billing_note: On IP geolocation, the `security` and `abuse` modules cost extra credits.
localization:
  parameter: lang
  values:
  - en
  - de
  - ru
  - ja
  - fr
  - cn
  - es
  - cs
  - it
  - ko
  - fa
  - pt
  applies_to: location name fields on geolocation-family endpoints
metering:
  model: credit-pool
  scope: one shared credit pool across every API
  charged_on: 2xx responses only
  refund: credits already charged for a failed request are refunded
  response_header: X-AF-Credits-Cost
  balance_api: https://apifreaks.com/api/usage-credits
  free_tier: 10,000 credits on signup, no credit card
  machine_readable: true
  note: As of the 2026-09-03 spec republish the X-AF-Credits-Cost response header is DECLARED IN THE CONTRACT — components.headers.X-AF-Credits-Cost,
    wired onto the 200 and 400 responses across the catalog. It was previously documented in prose only. An agent
    can now discover the per-call cost signal from the spec rather than from the docs page.
rate_limit_signalling:
  model: concurrency, not requests-per-second
  headers:
  - name: X-Concurrent-Threads
    meaning: maximum concurrent requests allowed
  - name: X-Concurrent-Threads-Active
    meaning: concurrent requests currently being processed
  exceeded: HTTP 429 "Please slow down. Allowed Maximum concurrent request limit has been reached."
  see: rate-limits/apifreaks-api-hub-for-developers-rate-limits.yml
request_tracing:
  request_id_header: null
  documented: false
  note: No request-id / correlation header is documented or returned. The error envelope carries `timestamp` and `path`
    but no trace identifier, so a support escalation cannot reference a single request.
versioning:
  style: uri-path
  see: lifecycle/apifreaks-api-hub-for-developers-lifecycle.yml
error_envelope:
  media_type: application/json
  fields:
  - timestamp
  - path
  - status
  - error
  - message
  rfc9457: false
  see: errors/apifreaks-api-hub-for-developers-problem-types.yml
async_operations:
  applies_to: PDF APIs
  model: task-based
  flow: POST a PDF operation -> receive {taskId, inputIds} -> poll GET /v1.0/pdf/task-status, or supply webhook_url
    to be notified on completion.
  webhooks: asyncapi/apifreaks-api-hub-for-developers-pdf-webhooks.yml
  template_generation:
    model: synchronous
    operations:
    - generatePdfFromTemplate
    - generatePdfsFromCsv
    note: New with the 2026-07-21 Template Builder release. Unlike every other PDF operation these do NOT return a
      taskId — they render inline and return a hosted pdf_url. Template authoring is browser-only; template_id and
      an optional `version` (must start with "v"; the literal "latest" is rejected — omit the parameter instead) are
      supplied by the caller from the dashboard.
cross_links:
  authentication: authentication/apifreaks-api-hub-for-developers-authentication.yml
  errors: errors/apifreaks-api-hub-for-developers-problem-types.yml
  lifecycle: lifecycle/apifreaks-api-hub-for-developers-lifecycle.yml
  rate_limits: rate-limits/apifreaks-api-hub-for-developers-rate-limits.yml
  mcp: mcp/apifreaks-api-hub-for-developers-mcp.yml
  webhooks: asyncapi/apifreaks-api-hub-for-developers-pdf-webhooks.yml
  data_model: data-model/apifreaks-api-hub-for-developers-data-model.yml
  packages: packages/apifreaks-api-hub-for-developers-packages.yml
reversibility:
  grade: documented
  applies: true
  write_surface: 22
  summary: APIFreaks publishes genuine inverse operations for the PDF security family and a delete for stored files,
    so a reversal path exists and is discoverable from the contract. It states NO window for any of them — no retention
    period for a stored file, no undo window on a delete, no expiry on a hosted generated PDF — so this grades `documented`,
    not `verified`. Never assume a window here; the docs state none.
  reversals:
  - action: encryptPdf (POST /pdf/encrypt)
    reversal: decryptPdf
    operationId: decryptPdf
    window: null
    docs: https://apifreaks.com/api/pdf-decrypt
    note: A published inverse pair. Both produce a NEW output file via a Task; neither mutates the input in place,
      so the original remains recoverable while it is retained.
  - action: restrictPdf (POST /pdf/restrict)
    reversal: unrestrictPdf
    operationId: unrestrictPdf
    window: null
    docs: https://apifreaks.com/api/pdf-unrestrict
    note: A published inverse pair, same new-output semantics.
  - action: uploadResource / uploadResourceBinary (stored file created)
    reversal: deleteFile
    operationId: deleteFile
    window: null
    docs: https://apifreaks.com/api/pdf-file
    note: DELETE /v1.0/pdf/file removes a stored file, reversing an upload.
  irreversible:
  - action: deleteFile (DELETE /pdf/file)
    reason: No restore, undelete or trash operation exists in any published spec. The MCP server annotates this tool
      DESTRUCTIVE — the only tool in 109 so marked. Once a fileId is deleted the bytes are gone unless the caller
      kept them.
  - action: Credit consumption on any 2xx
    reason: Credits are spent on success and are not refundable by any API call. The published refund rule covers
      FAILED requests only (4xx/5xx are refunded); a successful call that the agent did not intend cannot be reversed.
  - action: mergePdf / splitPdf / compressPdf / rotatePdfPages / extractPdfPages / deletePdfPage / linearizePdf /
      pdfToImage
    reason: 'Transform jobs produce new outputs rather than mutating inputs, so there is nothing to roll back — but
      there is also no cancel: no operation cancels an in-flight taskId, so a job submitted by mistake runs to completion
      and bills.'
  - action: generatePdfFromTemplate / generatePdfsFromCsv
    reason: 'Synchronous render to a hosted pdf_url. No revoke, expire-now or delete operation is published for a
      generated document. The response DOES carry a machine-readable `expiration_time` (ISO 8601) per document, which
      is the only lifecycle signal anywhere in the platform — but it is a returned value, not a stated policy: the
      published example shows created_at 2026-08-10 and expiration_time 2026-11-10 (90 days), and no page states that
      figure as a rule. Read the field; do not assume the number.'
  gaps:
  - No cancel operation for an in-flight PDF task.
  - No retention window published for stored files or generated PDFs, so "how long do I have to change my mind" is
    unanswerable from the contract.
  - No dry-run or preview mode on any write operation — an agent cannot rehearse a merge or a template render before
    spending credits.
  evidence:
  - url: https://apifreaks.com/docs
    http_status: 200
    finding: no retention, undo or cancellation policy stated
  - source: openapi/ (27 refined documents)
    finding: inverse pairs encrypt/decrypt and restrict/unrestrict present; no cancel, restore or refund operation
      exists
  machine_readable_expiry:
    field: expiration_time
    operations:
    - generatePdfFromTemplate
    - generatePdfsFromCsv
    stated_policy: false
    observed_in_published_example: created_at 2026-08-10 -> expiration_time 2026-11-10 (90 days)
    note: The only per-resource expiry the platform exposes. Stored PDF Files (fileId) carry no equivalent field and
      no published retention period.
dry_run_mode:
  supported: false
  note: No sandbox, no test key, no preview parameter. Every call is production and spends credits — see sandbox/apifreaks-api-hub-for-developers-sandbox.yml.
